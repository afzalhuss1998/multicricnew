<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FOR WhatsApp Message</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18113561351"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-18113561351');
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>➡️ For more information,</h1>

  <div class="tabs">
    <div class="tab active" onclick="showLang('en', this)">English</div>
    <div class="tab" onclick="showLang('hi', this)">हिन्दी</div>
    <div class="tab" onclick="showLang('kn', this)">ಕನ್ನಡ</div>
    <div class="tab" onclick="showLang('ta', this)">தமிழ்</div>
    <div class="tab" onclick="showLang('te', this)">తెలుగు</div>
  </div>

  <div class="content visible" id="text">
    ➡️ For more information,
  </div>

  <div class="click-direction">👇 Click below to message on WhatsApp</div>

  <a href="https://wa.me/+447599214073?text=FOR%20!D" class="whatsapp-btn" target="_blank">
    Message on WhatsApp
  </a>

  <!-- multicric Logo -->
  <div class="logo">
    <img src="logo.png" alt="multicric Logo" />
  </div>

  <script>
    const messages = {
      en: "➡️ For more information,",
      hi: "➡️ !D के लिए WhatsApp पर संदेश भेजें",
      kn: "➡️ !Dಗಾಗಿ WhatsApp ನಲ್ಲಿ ಸಂದೇಶ ಕಳುಹಿಸಿ",
      ta: "➡️ !Dக்காக WhatsApp இல் செய்தி அனுப்பவும்",
      te: "➡️ !D కొరకు WhatsApp లో సందేశం పంపండి"
    };

    function showLang(lang, el) {
      const content = document.getElementById("text");
      content.classList.remove("visible");

      setTimeout(() => {
        content.innerText = messages[lang];
        content.classList.add("visible");
      }, 150);

      document.querySelectorAll('.tab').forEach(tab => 
        tab.classList.remove('active')
      );

      el.classList.add('active');
    }
  </script>

</body>
</html>
