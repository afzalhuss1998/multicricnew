<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For More Information</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18113561351"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'AW-18113561351');
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #1f1f1f;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 60px;
      margin-bottom: 30px;
      font-weight: bold;
      line-height: 1.2;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
    }

    .tab {
      background: #3a3a3a;
      color: white;
      padding: 12px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 26px;
      transition: 0.3s;
    }

    .tab.active {
      background: #25D366;
      color: white;
      border: 2px solid white;
    }

    .content {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 25px;
      min-height: 60px;
    }

    .click-direction {
      color: #cfcfcf;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .whatsapp-btn {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 22px 45px;
      border-radius: 60px;
      font-size: 24px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(37,211,102,0.5);
    }

    .whatsapp-btn:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {

      h1 {
        font-size: 38px;
      }

      .content {
        font-size: 28px;
      }

      .tab {
        font-size: 18px;
        padding: 10px 18px;
      }

      .whatsapp-btn {
        font-size: 20px;
        padding: 18px 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>FOR MORE INFORMATION</h1>

    <div class="tabs">
      <div class="tab active" onclick="showLang('en', this)">English</div>
      <div class="tab" onclick="showLang('hi', this)">हिन्दी</div>
      <div class="tab" onclick="showLang('kn', this)">ಕನ್ನಡ</div>
      <div class="tab" onclick="showLang('ta', this)">தமிழ்</div>
      <div class="tab" onclick="showLang('te', this)">తెలుగు</div>
    </div>

    <div class="content" id="text">
      ➡️ For more information,
    </div>

    <div class="click-direction">
      👇 Click below to message on WhatsApp
    </div>

    <a 
      href="https://wa.me/+447599214073?text=FOR%20MORE%20INFORMATION"
      class="whatsapp-btn"
      target="_blank"
    >
      Message on WhatsApp
    </a>

  </div>

  <script>

    const messages = {
      en: "➡️ For more information,",
      hi: "➡️ अधिक जानकारी के लिए,",
      kn: "➡️ ಹೆಚ್ಚಿನ ಮಾಹಿತಿಗಾಗಿ,",
      ta: "➡️ மேலும் தகவலுக்கு,",
      te: "➡️ మరింత సమాచారం కోసం,"
    };

    function showLang(lang, el) {

      document.getElementById("text").innerText = messages[lang];

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      el.classList.add("active");
    }

  </script>

</body>
</html>
